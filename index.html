 مثلاً) لتظهر نتائج الاستهلاك بدقة. البيانات تُحفظ على السيرفر ويراها كل الملاك، والتعديل للمدير فقط (بعد «دخول المدير»). «نسخة احتياطية» اختيارية.<\/div>\n<\/div>\n<div id=\"p2\" hidden><div class=\"gal\" id=\"gal\"><\/div><\/div>\n<\/div>\n<dialog id=\"dlg\"><div style=\"font-weight:700\" id=\"dt\"><\/div>\n<label>التاريخ<\/label><input type=\"date\" id=\"fd\">\n<label id=\"fal\">المبلغ بالجنيه<\/label><input type=\"number\" step=\"0.01\" inputmode=\"decimal\" id=\"fa\">\n<label>ملاحظة (اختياري)<\/label><input id=\"fn\">\n<label>صورة (فاتورة أو العداد)<\/label><input type=\"file\" accept=\"image/*\" id=\"ff\">\n<div class=\"btns\" style=\"margin-top:14px\"><button class=\"b\" onclick=\"save()\">حفظ<\/button><button class=\"b o\" onclick=\"dlg.close()\">إلغاء<\/button><\/div><\/dialog>\n<dialog id=\"dv\"><img id=\"big\" alt=\"\"><div class=\"btns\" style=\"margin-top:10px\"><button class=\"b o\" onclick=\"dv.close()\">إغلاق<\/button><\/div><\/dialog>\n<script>\nconst R=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAR1ArwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDymiiikaBiiiigQlGKWkoC4YoxTgpNTw2zOelOxLZCqEngVct7MsRkVet7HABI5qwIijc9KpIzchIrRYgCRxU52DgCopWaThcinxRfIdzYIHQ96okY7Fxt/LFNFsqDcetK86IBt645zVSW4kk4UGgCd7pYOUODVW
